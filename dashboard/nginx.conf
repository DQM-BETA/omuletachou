server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ISSUE-223: o default do nginx (60s) derrubava jobs longos (ex.: coleta
        # do Mercado Livre, 2-6min) com 504 antes do backend terminar. Aplicado a
        # todo /api/ (nao so /api/jobs/) para cobrir qualquer endpoint futuro que
        # venha a ser sincrono e demorado, evitando reincidencia do mesmo bug em
        # outra rota. Custo: requisicoes com erro real de rede/API travada podem
        # demorar ate 600s para retornar erro ao cliente em vez de falhar rapido
        # aos 60s — aceitavel, pois nao ha timeout curto configurado no lado do
        # dashboard hoje que dependa disso.
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
